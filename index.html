<!DOCTYPE html>
<html lang="pt-MZ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemgala MZ - Renda Extra</title>
    <style>
        :root {
            --primary: #8a2be2;
            --secondary: #00f2ff;
            --dark: #0a0b10;
            --card: #161b22;
            --text: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--dark);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 0;
        }

        .container {
            width: 90%;
            max-width: 450px;
            padding: 20px;
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .logo-area h1 {
            font-size: 2.2rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        .reward-badge {
            background: rgba(0, 242, 255, 0.1);
            border: 1px solid var(--secondary);
            padding: 10px;
            border-radius: 12px;
            margin: 15px 0;
            font-weight: bold;
            color: var(--secondary);
            text-transform: uppercase;
        }

        .steps {
            text-align: left;
            margin-top: 20px;
        }

        .step-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 10px;
        }

        .step-num {
            background: var(--primary);
            color: white;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            flex-shrink: 0;
            font-weight: bold;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            margin: 25px 0;
        }

        .btn-wrapper {
            position: relative;
            display: inline-block;
            padding: 3px;
            border-radius: 50px;
            overflow: hidden;
            z-index: 1;
        }

        .btn-wrapper::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(transparent, var(--secondary), var(--primary), transparent 40%);
            animation: rotate 3s linear infinite;
            z-index: -2;
        }

        .btn-wrapper::after {
            content: '';
            position: absolute;
            inset: 3px;
            background: var(--card);
            border-radius: 50px;
            z-index: -1;
        }

        .btn-download {
            display: block;
            padding: 16px 40px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .video-container-yt {
            margin: 10px auto;
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid var(--secondary);
            position: relative;
            aspect-ratio: 16 / 9;
            background: #000;
        }

        .video-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.6;
        }

        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #fff;
        }

        .play-button::after {
            content: '';
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-left: 15px solid white;
            margin-left: 4px;
        }

        /* --- CONTADOR REAL NO FINAL --- */
        .footer-stats {
            margin-top: 30px;
            padding: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .stat-label {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 8px;
            display: block;
            text-transform: uppercase;
        }

        /* Estilo para o widget do contador */
        #sfc-widget {
            filter: grayscale(1) invert(1); /* Faz o contador combinar com o tema escuro */
            opacity: 0.8;
        }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .warning {
            color: #ffcc00;
            font-size: 0.75rem;
            margin-top: 15px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-area">
        <h1>Gemgala MZ</h1>
        <p>A alternativa real ao Aviator</p>
    </div>

    <div class="reward-badge">🎁 BÔNUS DE 730 MT</div>

    <div class="steps">
        <div class="step-item">
            <div class="step-num">1</div>
            <div><strong>Perfil:</strong> Cabeça de gatinho > <b>Meu Perfil</b>.</div>
        </div>
        <div class="step-item" style="border: 1px solid var(--secondary);">
            <div class="step-num">2</div>
            <div><strong>Validar:</strong> Faça <b>Verificação Facial</b> e use <b>Foto Real</b>.</div>
        </div>
        <div class="step-item">
            <div class="step-num">3</div>
            <div><strong>Atividade:</strong> Use a app por 24h para validar.</div>
        </div>
    </div>

    <div class="btn-container">
        <div class="btn-wrapper">
            <a href="https://getblock.me/u/21068680" class="btn-download">BAIXAR E GANHAR AGORA</a>
        </div>
    </div>

    <div class="video-container-yt">
        <a href="https://www.youtube.com/watch?v=3rwla-1lMLQ" target="_blank" style="display:block; height:100%;">
            <div class="play-button"></div>
            <img src="https://img.youtube.com/vi/3rwla-1lMLQ/maxresdefault.jpg" class="video-thumb">
        </a>
    </div>

    <!-- CONTADOR DE VISUALIZAÇÕES REAIS NO FINAL -->
    <div class="footer-stats">
        <span class="stat-label">Visualizações do Site</span>
        
        <!-- Widget de contador real -->
        <div id="sfc-widget">
            <a href="https://www.freecounterstat.com" title="contadores gratuitos">
                <img src="https://counter2.optistats.ovh/private/freecounterstat.php?c=gemgalamz1" border="0" title="contadores gratuitos" alt="contadores gratuitos">
            </a>
        </div>
    </div>

    <div class="warning">
        ⚠️ Oferta exclusiva para novos usuários em Moçambique.
    </div>
</div>

</body>
</html>
